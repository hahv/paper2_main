legion_sections:
    - title: "1. GT (Ground Truth)"
      map_name: "gt_color_map"
    - title: "2. NO SKIP (Baseline)"
      map_name: "no_skip_color_map"
    - title: "3. SKIP (Proposed Method)"
      map_name: "skip_color_map"

gt_color_map:
  FireSmoke:
    desc: Fire/Smoke
    color: "#e67e22" # Orange
  None:
    desc: None
    color: "#2ecc71" # Green

no_skip_color_map:
  Correct:
    desc: Match (Pred=GT)
    color: "#2ecc71" # Green
  False Alarm (FP):
    desc: Error (Pred=Fire/Smoke, GT=None)
    color: "#f1c40f" # Gold
  Miss (FN):
    desc: Error (Pred=None, GT=Fire/Smoke)
    color: "#e74c3c" # Red

skip_color_map:
  Miss (FN):
    desc: Unsafe Skip
    color: "#8e44ad" # Purple (Critical Failure)
  Waste (FP):
    desc: Unneeded Proc.
    color: "#f1c40f" # Gold (Inefficiency)
  True Skip (TN):
    desc: Correct Skip
    color: "#00b894" # Teal (Efficiency Success)
  True Proc. (TP):
    desc: Correct Processed
    color: "#2c3e50" # Navy (Valid Hit)

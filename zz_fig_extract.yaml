# method: no_temp; temp_motion_block_FrameDiff; temp_motion_block_AccMotionDet
indir: "/zout/reports/baseline_vs_accMotion/1GPU_SV__ds_UFireIndoorTest__mt_temp_method_motion_block__e1ccb7b889a0__20260401.144240"

outdir: "./paper/3.fig/_quality_analyses"

random_seed: 42 # For reproducibility of any random sampling in figure generation

exp_valid_types:
  - no_temp
  - temp_motion_block_FrameDiff
  - temp_motion_block_AccMotionDet

list_cases:
  - name: success
    sub_cases:
      - {
          case_name: success_skip,
          case_desc: "Frames that were successfully skipped (i.e., no DL infer wasted)",
          num_cases: 2,
          conditions: [
              { exp: "no_temp", raw_label: "None" },
              { exp: "temp_motion_block_AccMotionDet", raw_label: "skipped" },
            ],
        }
      - {
          case_name: success_infer,
          case_desc: "Skip module correctly detected motion and allowed DL inference to proceed",
          num_cases: 2,
          conditions: [
              { exp: "no_temp", raw_label: "detected" },
              { exp: "temp_motion_block_AccMotionDet", raw_label: "detected" },
            ],
        }
  - name: failure
    sub_cases:
      - {
          case_name: failure_false_skip,
          case_desc: "Frames incorrectly skipped despite containing fire/smoke (false negatives)",
          num_cases: 1,
          conditions:
            [
              { exp: "no_temp", gt_label: "fire_smoke" },
              { exp: "temp_motion_block_AccMotionDet", raw_label: "skipped" },
            ],
        }
      - {
          case_name: failure_wasted_infer,
          case_desc: "Skip module triggered inference on frames with no fire/smoke (wasted computation)",
          num_cases: 2,
          conditions:
            [
              { exp: "no_temp", gt_label: "None" },
              { exp: "temp_motion_block_AccMotionDet", raw_label: "None" },
            ],
        }
      - {
          case_name: failure_model_error_1,
          case_desc: "Skip module correctly allowed inference, but model misclassified the result",
          num_cases: 2,
          conditions:
            [
              { exp: "no_temp", gt_label: "fire_smoke" },
              { exp: "temp_motion_block_AccMotionDet", raw_label: "None" },
            ],
        }
      - {
          case_name: failure_model_error_2,
          case_desc: "Skip module correctly allowed inference, but model misclassified the result",
          num_cases: 1,
          conditions:
            [
              { exp: "no_temp", gt_label: "None" },
              {
                exp: "temp_motion_block_AccMotionDet",
                raw_label: ["Fire", "SmokeOnly"],
              },
            ],
        }

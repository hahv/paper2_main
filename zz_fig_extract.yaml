# method: no_temp_method; temp_method_motion_block_FrameDiffDet; temp_method_motion_block.AccMotionDet
indir: "./zout/reports/baseline_vs_accMotion"

outdir: "./paper/3.fig/quality_analyses"

random_seed: 42 # For reproducibility of any random sampling in figure generation

exp_valid_types:
  - no_temp_method
  - temp_method_motion_block.FrameDiffDet
  - temp_method_motion_block.AccMotionDet

list_cases:
  - name: success
    sub_cases:
      - {
          case_name: success_skip,
          case_desc: "Frames that were successfully skipped (i.e., no DL infer wasted)",
          num_cases: 2,
          conditions:
            [
              { exp: "no_temp_method", raw_label: "None" },
              {
                exp: "temp_method_motion_block.AccMotionDet",
                raw_label: "skipped",
              },
            ],
          prefer:
            [
              { video: "SomeVideoName.mp4", frames: [123, 456] },
              { video: "AnotherVideo.mp4", frames: [789] },
            ],
        }
      - {
          case_name: success_infer,
          case_desc: "Skip module correctly detected motion and allowed DL inference to proceed",
          num_cases: 2,
          conditions:
            [
              { exp: "no_temp_method", raw_label: "detected" },
              {
                exp: "temp_method_motion_block.AccMotionDet",
                raw_label: "detected",
              },
            ],
        }
  - name: failure
    sub_cases:
      - {
          case_name: failure_false_skip,
          case_desc: "Frames incorrectly skipped despite containing fire/smoke (false negatives)",
          num_cases: 1,
          conditions:
            [
              { exp: "no_temp_method", gt_label: "fire_smoke" },
              {
                exp: "temp_method_motion_block.AccMotionDet",
                raw_label: "skipped",
              },
            ],
        }
      - {
          case_name: failure_wasted_infer,
          case_desc: "Skip module triggered inference on frames with no fire/smoke (wasted computation)",
          num_cases: 2,
          conditions:
            [
              { exp: "no_temp_method", gt_label: "None" },
              {
                exp: "temp_method_motion_block.AccMotionDet",
                raw_label: "None",
              },
            ],
        }
      - {
          case_name: failure_model_error_1,
          case_desc: "Skip module correctly allowed inference, but model misclassified the result",
          num_cases: 2,
          conditions:
            [
              { exp: "no_temp_method", gt_label: "fire_smoke" },
              {
                exp: "temp_method_motion_block.AccMotionDet",
                raw_label: "None",
              },
            ],
        }
      - {
          case_name: failure_model_error_2,
          case_desc: "Skip module correctly allowed inference, but model misclassified the result",
          num_cases: 1,
          conditions:
            [
              { exp: "no_temp_method", gt_label: "None" },
              {
                exp: "temp_method_motion_block.AccMotionDet",
                raw_label: ["Fire", "SmokeOnly"],
              },
            ],
        }

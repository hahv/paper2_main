general:
  computer-name: MainPC
  is-optim-mode: false
  log-cfg:
    wandb-cfg: null
  outdir: ''
  project-dir: /mnt/e/SyncData/paper2_main/test/custom_exp
  seed: 1
  skip-exp-if-exists: false
  time-stamp: '20260309.141848'
infer-cfg:
  calc-metrics: true
  csv-columns:
  - pred_label
  csv-infer-pattern: _results
  do-infer: true
  limit: -1
  log-transforms: false
  num-infer-workers: 1
  save-csv-results: false
  save-timeline-vis: true
  save-video-results: false
  skip-if-exists: false
  timeline-table-mode: p
  use-profiler: false
  verbose: false
method-selector:
  list-methods:
  - extra-cfgs:
      tl_type: no_skip
    name: external_method
  - extra-cfgs:
      result_proc:
        video:
        - video_infer_rs_proc
    name: no_temp_method
  - extra-cfgs:
      persist_thres: 0.5
      result_proc:
        video:
        - video_infer_rs_proc
      window_size: 20
    name: temp_baseline_Tpt_method
  - extra-cfgs:
      result_proc:
        video:
        - video_block_skip_rs_proc
        - fgmask_block_skip_rs_proc
      skip_proc:
        name: motion_only_block_skip_proc
        params:
          block_ratio_th: 0.1
          block_size_orig: 32
          min_roi_ratio: 0.7
          motion:
            name: acc_motion_det.AccMotionDet
            params:
              decay: 1
              diff_frame_th: 3
              impact_plus_one: 5
              mask_th: 10
              max_val: 25
          scale_factor: 1.0
    name: temp_method_motion_block
  - extra-cfgs:
      result_proc:
        video:
        - video_block_skip_rs_proc
        - fgmask_block_skip_rs_proc
      skip_proc:
        name: rule_based_block_skip_proc
        params:
          block_active_thresh: 0.1
          block_size_orig: 32
          motion:
            name: framediff_det.FrameDiffDet
            params:
              diff_thresh: 3
          rule_params:
            active_ratio_threshold: 0.2
            wavelet_channel: r
            wavelet_energy_thres: 50.0
          scale_factor: 1.0
    name: temp_method_rule_block
  method-used:
    extra-cfgs:
      tl_type: no_skip
    name: external_method
  selected-method: external_method
metric-selector:
  list-metrics:
  - extra-cfgs:
      mode:
      - per_video
      - per_frame
    metric-names:
    - accuracy
    - f1_score
    - precision
    - recall (TPR)
    - FPR (False Alarm Rate)
    - FPS
    name: per_frame_metric
  - extra-cfgs:
      mode:
      - per_video
    metric-names:
    - accuracy
    - f1_score
    - precision
    - recall (TPR)
    - FPR (False Alarm Rate)
    - FPS
    name: per_video_metric
  metric-used:
    extra-cfgs:
      mode:
      - per_video
      - per_frame
    metric-names:
    - accuracy
    - f1_score
    - precision
    - recall (TPR)
    - FPR (False Alarm Rate)
    - FPS
    name: per_frame_metric
  selected-metric: per_frame_metric
model-cfg:
  base-model: dummy
  class-names:
  - Fire
  - None
  - SmokeOnly
  input-size:
  - 360
  - 640
  model-path: dummy

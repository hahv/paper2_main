# method: no_temp_method; temp_method_motion_block_FrameDiffDet; temp_method_motion_block.AccMotionDet
indir: "./zout/___reports/on_test_set/baseline_vs_accMotion_for_quality_vis"

outdir: "./paper/3.fig/quality_analyses"

random_seed: 42 # For reproducibility of any random sampling in figure generation

exp_valid_types:
  - no_temp_method
  - temp_method_motion_block.FrameDiffDet
  - temp_method_motion_block.AccMotionDet

# ! gt_label = [fire_smoke, none]
# ! raw_label = [fire, smokeonly, none, skipped]

list_cases:
  - name: success
        # r"(a) SKIP <br> Static BG  ✓ SKIP",
        # r"(b) INFER <br> Fire  ✓ RUN",
        # r"(c) INFER <br> Smoke ✓ RUN",
    sub_cases:
      - {
          case_name: success_skip,
          case_desc: "SKIP <br> Static BG  ✓ SKIP",
          num_cases: 2,
          conditions:
            [
              { col_name: "gt_label", raw_value: "none" },
              {
                col_name: "temp_method_motion_block.AccMotionDet",
                raw_value: "skipped",
              },
            ],
          prefer:
            [
              { video: "SomeVideoName.mp4", frames: [123, 456] },
              { video: "AnotherVideo.mp4", frames: [789] },
            ],
        }
      - {
          case_name: success_infer,
          case_desc: "INFER <br> Fire/Smoke  ✓ RUN",
          num_cases: 2,
          conditions:
            [
              { col_name: "gt_label", raw_value: "fire_smoke" },
              {
                col_name: "temp_method_motion_block.AccMotionDet",
                raw_value: ["fire", "smokeonly"],
              },
            ],
        }
  - name: failure
        # r"(a) WRONGLY SKIPPED <br> Slow Smoke (✗ MISSED)",
        # r"(b) WASTED INFER <br> Persistent Motion (✗ NO SAVINGS)",
        # r"(c) WRONG INFER <br> Properly Infer <br> But Wrongly Predicted <br> (✗ BIG MODEl ERROR)",
    sub_cases:
      - {
          case_name: failure_false_skip,
          case_desc: "WRONGLY SKIPPED <br> Slow Smoke (✗ MISSED)",
          num_cases: 1,
          conditions:
            [
              { col_name: "gt_label", raw_value: "fire_smoke" },
              {
                col_name: "temp_method_motion_block.AccMotionDet",
                raw_value: "skipped",
              },
            ],
        }
      - {
          case_name: failure_wasted_infer,
          case_desc: "WASTED INFER <br> Persistent Motion (✗ NO SAVINGS)",
          num_cases: 2,
          conditions:
            [
              { col_name: "gt_label", raw_value: "none" },
              {
                col_name: "temp_method_motion_block.AccMotionDet",
                raw_value: "none",
              },
            ],
        }
      - {
          case_name: failure_model_error_1,
          case_desc: "WRONG INFER <br> Properly Infer <br> But Wrongly Predicted <br> (✗ BIG MODEl ERROR)",
          num_cases: 2,
          conditions:
            [
              { col_name: "gt_label", raw_value: "fire_smoke" },
              {
                col_name: "temp_method_motion_block.AccMotionDet",
                raw_value: "none",
              },
            ],
        }

input: raw/_raw_opt_selected_rp__per_frame_frameDiff.csv
output: output/
sep: ";"
prepend_lines:
  - "Exp.;Parameters;;;; Metrics;;;;Ranking Score" # ← raw group header row

steps:
  # ── 1. CLEAN UP COLUMN NAMES ──────────────────────────────
  - type: rename
    mapping:
      "experiment": "Experiment"
      "skip_proc.name": "Method"
      "Combined_Score": "Combined Score"
      "metric_recall (tpr)": "Recall"
      "metric_fpr (false alarm rate)": "FPR"
      "metric_accuracy": "Accuracy"
      "metric_f1_score": "F1_Score"
      "metric_fps": "FPS"
      "metric_precision": "Precision"
      "w_S": "Weight Skip"
      "w_F": "Weight FAR"
      "w_R": "Weight Recall"
      "delta_R": "Recall Delta"
      "skip_rate": "Skip Rate"
      "skip_proc.params.motion.params.diff_thresh": "Diff threshold"
      "skip_proc.params.scale_factor": "Scale factor"
      "skip_proc.params.block_size_orig": "Block size"
      "skip_proc.params.block_ratio_th": "Block active threshold"
      "Recall_Drop" : "Recall Drop"

  # ── 2. DROP JUNK COLUMNS ──────────────────────────────────
  - type: drop
    columns:
      - skip_proc.params.motion.name # Redundant (always framediff_det.FrameDiffDet)

  # ── 3. FILTER SELECTED ROWS ───────────────────────────────
  - type: filter
    conditions:
      - { column: select, op: "==", value: "x" }

  # -- drop columns

  # ── 4. ROUND METRICS ──────────────────────────────────────
  # Using add_column to round floats so the CSV is readable
  - type: add_column
    cols:
      - name: Combined Score
        expr: "df['Combined Score'].round(4).replace(-1.0, 9999)" # Replace -1 with 9999 for better sorting (since -1 means invalid/failed config)
      - name: Recall
        expr: "(df['Recall'] * 100).round(2)" # Convert to percentage
      - name: FPR
        expr: "(df['FPR'] * 100).round(3)" # Convert to percentage
      - name: Accuracy
        expr: "(df['Accuracy'] * 100).round(2)"
      - name: F1_Score
        expr: "df['F1_Score'].round(2)"
      - name: Precision
        expr: "(df['Precision'] * 100).round(2)"
      - name: FPS
        expr: "df['FPS'].round(1)"
      - name: Skip Rate
        expr: "(df['Skip Rate'] * 100).round(2)"
      - name: "Exp."
        expr: "df['Experiment'].str.replace('.*mt_temp_method_motion_block.*', 'FrameDiff', regex=True).str.replace('.*mt_no_temp_method.*', 'Baseline (No Skip module)', regex=True)"
      - name: "Recall Drop"
        expr: "(df['Recall Drop'] * 100).round(2)" # Convert to percentage


  # ── 5. REORDER & SELECT COLUMNS ───────────────────────────
  - type: rename
    mapping:
      "Diff threshold": "Diff threshold $\\tau_d$"
      "Scale factor": "Scale factor $\\alpha$"
      "Block size": "Block size $B$"
      "Block active threshold": "Block active threshold $\\tau$"
      "Skip Rate": "Skip Rate (\\%)"
      "Recall": "Recall (\\%)"
      "FPR": "FPR (\\%)"

  - type: select
    columns:
      # Identification
      - Exp.
      # Hyperparameters
      - "Scale factor $\\alpha$"
      - "Block size $B$"
      - "Block active threshold $\\tau$"
      - "Diff threshold $\\tau_d$"

      # Primary Metrics
      - "Recall (\\%)"
      - "Skip Rate (\\%)"
      - "FPR (\\%)"
      - FPS
      - Combined Score
      - "Recall Drop"          # ← FIX: keep it through the pipeline


  # ── 6. SORT ───────────────────────────────────────────────
  # Sort by highest score first
  - type: sort
    by: ["Combined Score", "Recall (\\%)", "Skip Rate (\\%)", "FPR (\\%)",  "FPS"]
    ascending: [false, false, false, true, false]

  # ── 7. REPLACE SENTINEL → DISPLAY VALUE ──────────────────  ← ADD THIS
  - type: add_column
    cols:
    - name: Combined Score
      expr: "df['Combined Score'].apply(lambda x: '-' if x == 9999 else f'{x:.4f}')"

  - type: fillna
    mapping:
      "Scale factor $\\alpha$": "-"
      "Block size $B$": "-"
      "Block active threshold $\\tau$": "-"
      "Diff threshold $\\tau_d$": "-"
      "Skip Rate (\\%)": "-"
      "Combined Score": "-"

  # ── 8. STAMP ARROWS ───────────────────────────────────────
  - type: header_arrow
    columns:
      "Recall (\\%)":       up
      "Skip Rate (\\%)":    up
      "FPR (\\%)":          down
      FPS:                  up
      "Combined Score":     up

  # ── 9. HIGHLIGHT BEST ─────────────────────────────────────
  - type: highlight_best
    best:         [bold, color]
    second:       [underline, color]
    best_color:   black
    second_color: black
    skip_rows: 0
    strict: false

  # ── 10. APPEND DROP SUFFIX (after highlighting) ───────────
  - type: add_column
    cols:
      - name: "Recall (\\%) $\\uparrow$"
        expr: >
          df.apply(lambda x:
            str(x["Recall (\\%) $\\uparrow$"])
            if pd.isna(x["Recall Drop"])
            else str(x["Recall (\\%) $\\uparrow$"]) + " (-" + f"{x['Recall Drop']:.2f}" + ")",
            axis=1)
  # ── 12. DROP HELPER COLUMN ────────────────────────────────
  - type: drop                 # ← FIX: clean up before writing CSV
    columns:
      - "Recall Drop"

  # ── 13. CLEAN NAN VALUES ──────────────────────────────────
  # replace all "Combined Score" (as string = "nan") with '-' for better display (since
  # these are failed configs that shouldn't be ranked)
  - type: add_column
    cols:
      - name: "Combined Score $\\uparrow$"
        expr: >
          df["Combined Score $\\uparrow$"].replace('nan', '-')

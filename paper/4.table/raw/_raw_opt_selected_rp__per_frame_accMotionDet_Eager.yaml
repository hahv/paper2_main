input: raw/_raw_opt_selected_rp__per_frame_accMotionDet_Eager.csv
output: output/
sep: ";"
prepend_lines:
  - "Method;Parameters;;; Metrics;;;;Ranking Score"

steps:
  # ── 1. CLEAN UP COLUMN NAMES ──────────────────────────────
  - type: rename
    mapping:
      "experiment": "Experiment"
      "skip_proc.name": "Method"
      "Combined_Score": "Combined Score"
      "metric_recall (tpr)": "Recall"
      "metric_fpr (false alarm rate)": "FPR"
      "metric_accuracy": "Accuracy"
      "metric_f1_score": "F1_Score"
      "metric_fps": "FPS"
      "metric_precision": "Precision"
      "w_S": "Weight Skip"
      "w_F": "Weight FAR"
      "w_R": "Weight Recall"
      "delta_R": "Recall Delta"
      "skip_rate": "Skip Rate"
      "skip_proc.params.n_chk": "N_chk"
      "skip_proc.params.w_clr": "W_clr"
      "skip_proc.params.fire_confirm_k": "W_fire"
      "Recall_Drop": "Recall Drop"

  # ── 2. DROP JUNK COLUMNS ──────────────────────────────────
  - type: drop
    columns:
      - skip_proc.params.motion.name

  # ── 3. FILTER SELECTED ROWS ───────────────────────────────
  - type: filter
    conditions:
      - { column: select, op: "==", value: "x" }

  # ── 4. ROUND METRICS ──────────────────────────────────────
  - type: add_column
    cols:
      - name: N_chk
        expr: "df['N_chk'].round(0)"
      - name: W_clr
        expr: "df['W_clr'].round(0)"
      - name: W_fire
        expr: "df['W_fire'].round(0)"
      - name: Combined Score
        expr: "df['Combined Score'].round(4).replace(-1.0, 9999)"
      - name: Recall
        expr: "(df['Recall'] * 100).round(3)"
      - name: FPR
        expr: "(df['FPR'] * 100).round(3)"
      - name: Accuracy
        expr: "(df['Accuracy'] * 100).round(3)"
      - name: F1_Score
        expr: "df['F1_Score'].round(3)"
      - name: Precision
        expr: "(df['Precision'] * 100).round(3)"
      - name: FPS
        expr: "df['FPS'].round(2)"
      - name: Skip Rate
        expr: "(df['Skip Rate'] * 100).round(2)"
      - name: "Exp."
        expr: "df['Experiment'].str.replace('.*mt_temp_method_motion_block_eager.*', 'AccMotionDet (Eager Mode)', regex=True).str.replace('.*mt_temp_method_motion_block.*', 'AccMotionDet', regex=True).str.replace('.*mt_no_temp_method.*', 'Baseline (No Skip module)', regex=True)"
      - name: "Recall Drop"
        expr: "(df['Recall Drop'] * 100).round(3)"

  # ── 5. REORDER & SELECT COLUMNS ───────────────────────────
  - type: rename
    mapping:
      "N_chk": "$N_{chk}$"
      "W_clr": "$W_{clr}$"
      "W_fire": "$W_{fire}$"
      "Skip Rate": "Skip Rate (\\%)"
      "Recall": "Recall (\\%)"
      "FPR": "FAR (\\%)"

  - type: select
    columns:
      - Exp.
      - "$W_{fire}$"
      - "$W_{clr}$"
      - "$N_{chk}$"
      - "Recall (\\%)"
      - "Skip Rate (\\%)"
      - "FAR (\\%)"
      - FPS
      - Combined Score
      - "Recall Drop"

  # ── 6. SORT ───────────────────────────────────────────────
  - type: sort
    by: ["Combined Score"]
    ascending: [false]

  # ── 7. REPLACE SENTINEL → DISPLAY VALUE ──────────────────
  - type: add_column
    cols:
      - name: Combined Score
        expr: "df['Combined Score'].apply(lambda x: '-' if pd.isna(x) or float(x) >= 9997 else f'{float(x):.4f}')"

  # ── 7b. DECIMAL FORMAT (after sentinel replaced) ──────────
  - type: decimal_format
    cols:
      "Recall (\\%)": 3       # 93.900
      "FAR (\\%)": 3          # 0.737
      "Skip Rate (\\%)": 2    # 44.39
      FPS: 2                  # 36.30
      "$N_{chk}$": int        # 5.0  → 5
      "$W_{clr}$": int        # 10.0 → 10
      "$W_{fire}$": int       # 3.0  → 3

  - type: fillna
    mapping:
      "$N_{chk}$": "-"
      "$W_{clr}$": "-"
      "$W_{fire}$": "-"
      "Skip Rate (\\%)": "-"
      "Combined Score": "-"

  # ── 8. STAMP ARROWS ───────────────────────────────────────
  - type: header_arrow
    columns:
      "Recall (\\%)": up
      "Skip Rate (\\%)": up
      "FAR (\\%)": down
      FPS: up
      "Combined Score": up

  # ── 9. HIGHLIGHT BEST ─────────────────────────────────────
  - type: highlight_best
    best: [bold, color]
    second: [underline, color]
    best_color: black
    second_color: black
    skip_rows: 0
    strict: false

  # ── 10. APPEND RECALL DROP SUFFIX (after highlighting) ────
  - type: add_column
    cols:
      - name: "Recall (\\%) $\\uparrow$"
        expr: >
          df.apply(lambda x:
            str(x["Recall (\\%) $\\uparrow$"])
            if pd.isna(x["Recall Drop"])
            else str(x["Recall (\\%) $\\uparrow$"]) + " (-" + f"{float(x['Recall Drop']):.2f}" + ")",
            axis=1)

  # ── 11. DROP HELPER COLUMN ────────────────────────────────
  - type: drop
    columns:
      - "Recall Drop"

  # ── 12. CLEAN NAN VALUES ──────────────────────────────────
  - type: add_column
    cols:
      - name: "Combined Score $\\uparrow$"
        expr: >
          df["Combined Score $\\uparrow$"].replace('nan', '-')
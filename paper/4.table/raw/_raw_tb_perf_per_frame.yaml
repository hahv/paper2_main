input: raw/_raw_tb_perf_per_frame.csv
output: output/
sep: ";"

steps:
  # ── 1. SHAPE THE SCHEMA ───────────────────────────────────
  - type: rename
    mapping:
      Metric: Method

  - type: str_op
    ops:
      - {
          column: Method,
          op: replace,
          search: "MainPC__ds_UFireIndoorTest__mt_no_temp_method__af4b0d32a3d2__20260330.205208",
          replace-with: "Our Big Model (without Skip Module)",
        }
      - {
          column: Method,
          op: replace,
          search: "MainPC__ds_UFireIndoorTest__mt_temp_method_motion_block__e1ccb7b889a0__20260421.145709",
          replace-with: "Our Big Model (with Skip Module)",
        }
      - {
          column: Method,
          op: replace,
          search: "firenet_per_frame",
          replace-with: "FireNet",
        }
      - {
          column: Method,
          op: replace,
          search: "mobilenet_per_frame",
          replace-with: "MobileNet",
        }
      - {
          column: Method,
          op: replace,
          search: "yolov5s_notemp_per_frame",
          replace-with: "YOLOv5s",
        }
      - {
          column: Method,
          op: replace,
          search: "yolov5l_notemp_per_frame",
          replace-with: "YOLOv5l",
        }

  # ── 3. FILTER ROWS ────────────────────────────────────────
  - type: filter
    conditions:
      - {
          column: Method,
          op: "in",
          value: ["Our Big Model (without Skip Module)", "Our Big Model (with Skip Module)", "FireNet", "MobileNet", "YOLOv5s", "YOLOv5l"],
        }

  # ── 4. JOIN CITE ──────────────────────────────────────────
  - type: join
    file: raw/_raw_tb_perf_per_frame_cite.csv
    key: Method
    how: left
    sep: ";"

  - type: add_column
    cols:
      - name: Method
        expr: "df['Method'].str.strip() + ' ' + df['Cite'].fillna('').astype(str).str.strip()"

  # ── 5. CUSTOM SORTING ─────────────────────────────────────
  - type: add_column
    cols:
      - name: is_skip_module
        expr: "df['Method'].str.contains('Our Big Model (with Skip Module)', regex=False).astype(int)"

  # ── 6. SORT & LIMIT ───────────────────────────────────────
  - type: sort
    by: [is_skip_module, metric_recall (tpr), metric_fpr (false alarm rate), metric_fps, metric_accuracy]
    ascending: [true, true, true, false, false]

  - type: select
    columns:
      - Method
      - metric_recall (tpr)
      - metric_fpr (false alarm rate)
      - metric_accuracy
      - metric_f1_score
      - metric_precision
      - metric_fps
      - GFLOPs
      - Model size (Mb)

  # ── 7. RENAME FOR DISPLAY ─────────────────────────────────
  - type: rename
    mapping:
      "metric_recall (tpr)": "Recall"
      "metric_fpr (false alarm rate)": "FAR"
      "metric_accuracy": "Accuracy"
      "metric_f1_score": "F1-Score"
      "metric_precision": "Precision"
      "metric_fps": "FPS"

  # ── 8. FORMAT METRICS ─────────────────────────────────────
  - type: add_column
    cols:
      - name: Recall
        expr: "(df['Recall'] * 100).round(3)"
      - name: FAR
        expr: "(df['FAR'] * 100).round(3)"
      - name: Accuracy
        expr: "(df['Accuracy'] * 100).round(3)"
      - name: F1-Score
        expr: "df['F1-Score'].round(3)"
      - name: Precision
        expr: "(df['Precision'] * 100).round(3)"
      - name: FPS
        expr: "df['FPS'].round(2)"
      - name: GFLOPs
        expr: "df['GFLOPs'].round(2)"
      - name: Model size (Mb)
        expr: "df['Model size (Mb)'].round(2)"

  - type: decimal_format
    cols:
      Recall: 3
      FAR: 3
      Accuracy: 3
      F1-Score: 3
      Precision: 3
      FPS: 2
      GFLOPs: 2
      Model size (Mb): 2

  - type: rename
    mapping:
      "Recall": "Recall (\\%)"
      "FAR": "FAR (\\%)"
      "Accuracy": "Accuracy (\\%)"
      "Precision": "Precision (\\%)"
      "F1-Score": "F1 Score"

  # ── 9. STAMP ARROWS ───────────────────────────────────────
  - type: header_arrow
    columns:
      "Recall (\\%)": up
      "FAR (\\%)": down
      "Accuracy (\\%)": up
      "F1 Score": up
      "Precision (\\%)": up
      "FPS": up
      GFLOPs: down
      "Model size (Mb)": down

  # ── 10. HIGHLIGHT BEST ────────────────────────────────────
  - type: highlight_best
    best: [bold, color]
    second: [underline, color]
    best_color: black
    second_color: black
    skip_rows: 0
    strict: false
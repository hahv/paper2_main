input: raw/_raw_opt_selected_rp__per_frame.csv
output: output/
sep: ";"
prepend_lines:
  - "Method;Parameters;;;;;;;; Metrics;;;;Combined Score"   # ← raw group header row

steps:
  # ── 1. CLEAN UP COLUMN NAMES ──────────────────────────────
  - type: rename
    mapping:
      "experiment": "Experiment"
      "skip_proc.name": "Method"
      "Combined_Score": "Combined Score"
      "metric_recall (tpr)": "Recall"
      "metric_fpr (false alarm rate)": "FPR"
      "metric_accuracy": "Accuracy"
      "metric_f1_score": "F1_Score"
      "metric_fps": "FPS"
      "metric_precision": "Precision"
      "w_S": "Weight Skip"
      "w_F": "Weight FAR"
      "w_R": "Weight Recall"
      "delta_R": "Recall Delta"
      "skip_rate": "Skip Rate"
      "skip_proc.params.motion.params.diff_frame_th": "Diff threshold"
      "skip_proc.params.motion.params.impact_plus_one": "Motion increment"
      "skip_proc.params.motion.params.mask_th": "Activation threshold"
      "skip_proc.params.motion.params.max_val": "Accumulation cap"
      "skip_proc.params.motion.params.decay": "Decay rate"
      "skip_proc.params.scale_factor": "Scale factor"
      "skip_proc.params.block_size_orig": "Block size"
      "skip_proc.params.block_ratio_th": "Block active threshold"

  # ── 2. DROP JUNK COLUMNS ──────────────────────────────────
  - type: drop
    columns:
      - skip_proc.params.motion.name # Redundant (always acc_motion_det)

  # ── 4. ROUND METRICS ──────────────────────────────────────
  # Using add_column to round floats so the CSV is readable
  - type: add_column
    cols:
      - name: Combined Score
        expr: "df['Combined Score'].round(4)"
      - name: Recall
        expr: "(df['Recall'] * 100).round(2)" # Convert to percentage
      - name: FPR
        expr: "(df['FPR'] * 100).round(2)" # Convert to percentage
      - name: Accuracy
        expr: "(df['Accuracy'] * 100).round(2)"
      - name: F1_Score
        expr: "df['F1_Score'].round(2)"
      - name: Precision
        expr: "(df['Precision'] * 100).round(2)"
      - name: FPS
        expr: "df['FPS'].round(1)"
      - name: Skip Rate
        expr: "(df['Skip Rate'] * 100).round(2)"
      - name: "Exp."
        expr: "df['Experiment'].str.replace('.*mt_temp_method_motion_block.*', 'AccMotionDet', regex=True).str.replace('.*mt_no_temp_method.*', 'Baseline (No Skip module)', regex=True)"

  # ── 5. REORDER & SELECT COLUMNS ───────────────────────────
  - type: rename
    mapping:
      "Diff threshold": "Diff threshold $\\tau_d$"
      "Motion increment": "Motion increment $\\omega$"
      "Activation threshold": "Activation threshold $\\tau_m$"
      "Accumulation cap": "Acc. cap $K_{\\max}$"
      "Decay rate": "Decay rate $\\delta$"
      "Scale factor": "Scale factor $\\alpha$"
      "Block size": "Block size $B$"
      "Block active threshold": "Block active threshold $\\tau$"
      "Skip Rate": "Skip Rate (\\%)"
      "Recall": "Recall (\\%)"
      "FPR": "FPR (\\%)"

  - type: select
    columns:
      # Identification
      - Exp.
      # - Method
      # Hyperparameters
      - "Scale factor $\\alpha$"
      - "Block size $B$"
      - "Block active threshold $\\tau$"
      - "Diff threshold $\\tau_d$"
      - "Motion increment $\\omega$"
      - "Activation threshold $\\tau_m$"
      - "Acc. cap $K_{\\max}$"
      - "Decay rate $\\delta$"

      # Primary Metrics
      - "Recall (\\%)"
      - "FPR (\\%)"
      - "Skip Rate (\\%)"
      - FPS
      - Combined Score
      # Detailed
      # - recall_retention
      # - far_reduction_norm
      # - Skip Rate
      # - Weight Skip
      # - Weight FAR
      # - Weight Recall
      # - Recall Delta

      # Secondary Metrics
      # - F1_Score
      # - Accuracy
      # - Precision



  # ── 6. SORT ───────────────────────────────────────────────
  # Sort by highest score first
  - type: sort
    by: [Exp., Combined Score]
    ascending: [false, false]
  - type: fillna
    mapping:
      "Scale factor $\\alpha$": "-"
      "Block size $B$": "-"
      "Block active threshold $\\tau$": "-"
      "Diff threshold $\\tau_d$": "-"
      "Motion increment $\\omega$": "-"
      "Activation threshold $\\tau_m$": "-"
      "Acc. cap $K_{\\max}$": "-"
      "Decay rate $\\delta$": "-"
      "Skip Rate (\\%)": "-"
      "Combined Score": "-"
input: raw/_raw_opt_selected_rp__per_frame.csv
output: output/
sep: ";"

steps:
  # ── 1. CLEAN UP COLUMN NAMES ──────────────────────────────
  - type: rename
    mapping:
      "experiment": "Experiment"
      "skip_proc.name": "Method"
      "Combined_Score": "Combined Score"
      "metric_recall (tpr)": "Recall"
      "metric_fpr (false alarm rate)": "FPR"
      "metric_accuracy": "Accuracy"
      "metric_f1_score": "F1_Score"
      "metric_fps": "FPS"
      "metric_precision": "Precision"
      "w_S": "Weight Skip"
      "w_F": "Weight FAR"
      "w_R": "Weight Recall"
      "delta_R": "Recall Delta"
      "skip_proc.params.motion.params.diff_frame_th": "Diff threshold $\\tau_d$"
      "skip_proc.params.motion.params.impact_plus_one": "Motion increment $\\omega$"
      "skip_proc.params.motion.params.mask_th": "Activation threshold $\\tau_m$"
      "skip_proc.params.motion.params.max_val": "Accumulation cap $K_{\\max}$"
      "skip_proc.params.motion.params.decay": "Decay rate $\\delta$"
      "skip_proc.params.scale_factor": "Scale factor $\\alpha$"
      "skip_proc.params.block_size_orig": "Block size $B$"
      "skip_proc.params.block_ratio_th": "Block active threshold $\\tau$"
      # "skip_proc.params.min_roi_ratio": "Min_ROI"

  # ── 2. DROP JUNK COLUMNS ──────────────────────────────────
  - type: drop
    columns:
      - skip_proc.params.motion.name # Redundant (always acc_motion_det)

  # ── 4. ROUND METRICS ──────────────────────────────────────
  # Using add_column to round floats so the CSV is readable
  - type: add_column
    cols:
      - name: Combined Score
        expr: "df['Combined Score'].round(4)"
      - name: Recall
        expr: "(df['Recall'] * 100).round(2)" # Convert to percentage
      - name: FPR
        expr: "(df['FPR'] * 100).round(2)" # Convert to percentage
      - name: Accuracy
        expr: "(df['Accuracy'] * 100).round(2)"
      - name: F1_Score
        expr: "df['F1_Score'].round(2)"
      - name: Precision
        expr: "(df['Precision'] * 100).round(2)"
      - name: FPS
        expr: "df['FPS'].round(1)"
      - name: skip_rate
        expr: "(df['skip_rate'] * 100).round(2)"

  # ── 5. REORDER & SELECT COLUMNS ───────────────────────────
  - type: select
    columns:
      # Identification
      - Experiment
      # - Method
      # Hyperparameters
      - Scale factor $\\alpha$
      - Block size $B$
      - Block active threshold $\\tau$
      - Diff threshold $\\tau_d$
      - Motion increment $\\omega$
      - Activation threshold $\\tau_m$
      - Accumulation cap $K_{\\max}$
      - Decay rate $\\delta$

      # Primary Metrics
      - Combined Score
      - Recall
      - FPR
      - FPS
      # Detailed
      # - recall_retention
      # - far_reduction_norm
      # - skip_rate
      # - Weight Skip
      # - Weight FAR
      # - Weight Recall
      # - Recall Delta

      # Secondary Metrics
      # - F1_Score
      # - Accuracy
      # - Precision



  # ── 6. SORT ───────────────────────────────────────────────
  # Sort by highest score first
  - type: sort
    by: [Combined Score]
    ascending: [false]

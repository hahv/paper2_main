input: raw/users.csv
output: output/
sep: ";"

steps:
  # ── 1. SHAPE THE SCHEMA ───────────────────────────────────
  - type: rename
    mapping:
      user_id: id
      full_name: name
      e_mail: email

  - type: drop
    columns: [internal_notes, debug_flag]

  # ── 2. FIX VALUES ─────────────────────────────────────────
  - type: fillna
    mapping:
      status: "unknown"
      age: 0

  - type: cast
    mapping:
      age: int
      score: float
      created_at: datetime
      is_active: bool

  - type: str_op
    ops:
      - { column: name,   op: strip }
      - { column: email,  op: lower }
      - { column: status, op: upper }
      - { column: phone,  op: replace, search: "-", replace-with: "" }

  # ── 3. FILTER ROWS ────────────────────────────────────────
  - type: filter
    conditions:
      - { column: status,  op: "==", value: "ACTIVE" }
      - { column: age,     op: ">=", value: 18 }
      - { column: country, op: "in", value: ["KR", "JP", "US"] }

  - type: dedupe
    subset: [email]
    keep: first

  # ── 4. JOIN ───────────────────────────────────────────────
  # Join orders — different key names
  - type: join
    file: test/test_csv_ops/orders.csv
    left_on: id
    right_on: user_id
    how: left
    suffixes: ["", "_order"]

  # Join payments — same key name
  - type: join
    file: test/test_csv_ops/payments.csv
    key: order_id              # ← was "on:", which YAML 1.1 parses as True
    how: left
    suffixes: ["", "_pay"]

  - type: drop
    columns: [user_id_order, user_id_pay]


  # ── 5. NEW COLUMNS ────────────────────────────────────────
  - type: add_column
    cols:
      - name: full_label
        expr: "df['name'] + ' (' + df['email'] + ')'"
      - name: is_senior
        expr: "df['age'] >= 60"

  # ── 6. SELECT & REORDER ───────────────────────────────────
  - type: select
    columns: [id, name, email, age, status, country,
              order_id, product, amount, order_date,
              payment_id, method, paid_at, confirmed,
              full_label, is_senior]

  # ── 7. SORT & LIMIT ───────────────────────────────────────
  - type: sort
    by: [age]
    ascending: [false]

  - type: limit
    n: 100

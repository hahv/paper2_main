input: raw/_raw_tb_cmp_other_temp_with_eager.csv
output: output/
sep: ";"

steps:
  # ── 1. RENAME FOR DISPLAY ─────────────────────────────────
  - type: rename
    mapping:
      "metric_recall (tpr)": "Recall"
      "metric_fpr (false alarm rate)": "FAR"
      "metric_accuracy": "Accuracy"
      "metric_f1_score": "F1-Score"
      "metric_precision": "Precision"
      "metric_fps": "FPS"

  # ── 2. FORMAT METRICS ─────────────────────────────────────
  - type: add_column
    cols:
      - name: Recall
        expr: "(df['Recall'] * 100).round(3)"
      - name: FAR
        expr: "(df['FAR'] * 100).round(3)"
      - name: Accuracy
        expr: "(df['Accuracy'] * 100).round(3)"
      - name: F1-Score
        expr: "df['F1-Score'].round(3)"
      - name: Precision
        expr: "(df['Precision'] * 100).round(3)"
      - name: FPS
        expr: "df['FPS'].round(2)"
      - name: "Skip Rate"
        expr: "(df['Skip Rate'] * 100).round(2)"

  # ── 2b. DECIMAL FORMAT ────────────────────────────────────
  - type: decimal_format
    cols:
      Recall: 3         # 95.6   → 95.600
      FAR: 3            # 0.25   → 0.250
      Accuracy: 3       # 98.7   → 98.700
      Precision: 3      # 99.1   → 99.100
      "F1-Score": 3     # 0.973  → 0.9730
      FPS: 2            # 24.9   → 24.97
      "Skip Rate": 2    # 34.9   → 34.93
  # ── 3. SORT & SELECT ───────────────────────────────────────
  - type: sort
    by: [Recall, FAR, FPS]
    ascending: [true, true, false]

  - type: rename
    mapping:
      "Recall": "Recall (\\%)"
      "FAR": "FAR (\\%)"
      "Accuracy": "Accuracy (\\%)"
      "Precision": "Precision (\\%)"
      "F1-Score": "F1 Score"
      "Skip Rate": "Skip Rate (\\%)"
  - type: sort
    by: ["order"]
    ascending: [true]
  - type: select
    columns:
      - Method
      - "Recall (\\%)"
      - "FAR (\\%)"
      - "Accuracy (\\%)"
      - "F1 Score"
      - "Precision (\\%)"
      - "Skip Rate (\\%)"
      - "FPS"

  # ── 4. STAMP ARROWS ───────────────────────────────────────
  - type: header_arrow
    columns:
      "Recall (\\%)": up
      "FAR (\\%)": down
      "Accuracy (\\%)": up
      "Precision (\\%)": up
      "F1 Score": up
      "Skip Rate (\\%)": up
      "FPS": up

  # ── 5. HIGHLIGHT BEST ─────────────────────────────────────
  - type: highlight_best
    best: [bold, color]
    second: [underline, color]
    best_color: black
    second_color: black
    skip_rows: 0
    strict: false

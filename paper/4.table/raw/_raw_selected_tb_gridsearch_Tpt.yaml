input: raw/raw_selected_tb_gridsearch_Tpt.csv
output: output/
sep: ";"

steps:
  # ── 1. CLEAN UP COLUMN NAMES ──────────────────────────────
  - type: rename
    mapping:
      "experiment": "Experiment"
      "window_size": "Window Size"
      "persist_thres": "Persist Threshold"
      "metric_recall (tpr)": "Recall"
      "metric_fpr (false alarm rate)": "FAR"
      "Recall_Drop": "Recall Drop"
      "FAR_drop": "FAR Drop"
      "delta_R": "Delta R"
      "metric_accuracy": "Accuracy"
      "metric_f1_score": "F1_Score"
      "metric_fps": "FPS"
      "metric_precision": "Precision"

  # ── 2. ROUND METRICS ──────────────────────────────────────
  - type: add_column
    cols:
      - name: Recall
        expr: "(df['Recall'] * 100).round(3)"
      - name: FAR
        expr: "(df['FAR'] * 100).round(3)"
      - name: Accuracy
        expr: "(df['Accuracy'] * 100).round(3)"
      - name: F1_Score
        expr: "df['F1_Score'].round(3)"
      - name: Precision
        expr: "(df['Precision'] * 100).round(3)"
      - name: FPS
        expr: "df['FPS'].round(2)"
      - name: "Recall Drop"
        expr: "(df['Recall Drop'] * 100).round(3)"
      - name: "FAR Drop"
        expr: "(df['FAR Drop'] * 100).round(3)"

  # ── 3. REORDER & SELECT COLUMNS ───────────────────────────
  - type: rename
    mapping:
      "Window Size": "Window Size $W$"
      "Persist Threshold": "Persist Threshold $\\tau_p$"
      "Recall": "Recall (\\%)"
      "FAR": "FAR (\\%)"
      "Accuracy": "Accuracy (\\%)"
      "Precision": "Precision (\\%)"
      "F1_Score": "F1 Score"
  - type: select
    columns:
      - Experiment
      - "Window Size $W$"
      - "Persist Threshold $\\tau_p$"
      - "Recall (\\%)"
      - "FAR (\\%)"
      - "Accuracy (\\%)"
      - "F1 Score"
      - "Precision (\\%)"
      - FPS
      - "Recall Drop"
      - "FAR Drop"

   # ── 4a. DECIMAL FORMAT ─────────────────────────────────────
  - type: decimal_format
    cols:
      "Recall (\\%)": 3        # 94.3  → 94.30
      "FAR (\\%)": 3           # 0.74  → 0.7400
      "Accuracy (\\%)": 3      # 98.2  → 98.20
      "Precision (\\%)": 3     # 97.0  → 97.00
      "F1 Score": 3            # 0.956 → 0.9560
      FPS: 2                   # 24.6  → 24.66
      "Window Size $W$": int   # 5.0   → 5
      "Persist Threshold $\\tau_p$": 1  # 0.2 → 0.2 (already 1dp, keeps it consistent)
  # ── 4b. FILLNA ───────────────────────────────────────────────
  - type: fillna
    mapping:
      "Window Size $W$": "-"
      "Persist Threshold $\\tau_p$": "-"

  # ── 5. STAMP ARROWS ───────────────────────────────────────
  - type: header_arrow
    columns:
      "Recall (\\%)": up
      "FAR (\\%)": down
      "Accuracy (\\%)": up
      "Precision (\\%)": up
      "F1 Score": up
      FPS: up

  # ── 6. HIGHLIGHT BEST ─────────────────────────────────────
  - type: highlight_best
    best: [bold, color]
    second: [underline, color]
    best_color: black
    second_color: black
    skip_rows: 0
    strict: false

  # # ── 7. APPEND DROP SUFFIX (after highlighting) ───────────
  # - type: add_column
  #   cols:
  #     - name: "Recall (\\%) $\\uparrow$"
  #       expr: >
  #         df.apply(lambda x:
  #           str(x["Recall (\\%) $\\uparrow$"])
  #           if pd.isna(x["Recall Drop"])
  #           else str(x["Recall (\\%) $\\uparrow$"]) + " (-" + f"{x['Recall Drop']:.2f}" + ")",
  #           axis=1)
  #     - name: "FAR (\\%) $\\downarrow$"
  #       expr: >
  #         df.apply(lambda x:
  #           str(x["FAR (\\%) $\\downarrow$"])
  #           if pd.isna(x["FAR Drop"])
  #           else str(x["FAR (\\%) $\\downarrow$"]) + " (-" + f"{x['FAR Drop']:.4f}" + ")",
  #           axis=1)

  # ── 8. DROP HELPER COLUMN ────────────────────────────────
  - type: drop
    columns:
      - "Recall Drop"
      - "FAR Drop"

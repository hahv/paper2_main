__base__: config/eb0_notemp.yaml

general:
  seed: 1
  computer_name: null # PC name that run the experiment
  outdir: zout/perf
  time_stamp: 20250925.173913
  log_cfg:
    wandb_cfg:
      project: "paper2_main"
      mode: "online"
metric_cfg:
  list_metrics: [] # empty, will populate from config/metrics
  selected_metric_set_name: metric_per_frame # metric_per_video

method_cfg:
  list_methods: [] # empty, will populate from config/methods
  selected_method_name: no_temp #temp_tpt #no_temp #temp_stabilize
  tag: "OLD_model"

dataset_cfg:
  list_datasets: [] # empty, will populate from config/datasets
  selected_dataset_name: DFire
model_cfg:
  base_model: hgnetv2_b5.ssld_stage2_ft_in1k # timm
  model_path: models/prof_OLD_hgnetv2_b5.ssld_stage2_ft_in1k-20250620-50-98.78.pth
  class_names: [Fire, None, SmokeOnly]
  input_size: [360, 640] # [H, W], for timm models

infer_cfg:
  do_infer: true
  skip_if_exists: false
  limit: -1 # -1 for no limit
  save_video_results: true
  save_csv_results: true
  csv_columns:
    - class_names
    - logits
    - probs
    - pred_label_idx
    - pred_label
  calc_metrics: true
  verbose: false
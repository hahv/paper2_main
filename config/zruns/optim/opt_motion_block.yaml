extra_cfgs:
  result_proc:
    video: [video_block_skip_rs_proc, fgmask_block_skip_rs_proc]
  skip_proc:
    name: motion_only_block_skip_proc.MotionOnlyBlockSkipProc
    params:
      motion: # ! params for motion detector inside skip proc
        name: acc_motion_det.AccMotionDet
        params:
          # --- 4. Pixel Sensitivity (The "Physics" Knob) ---
          # Search Space: [2, 3, 5]
          # --- 3. Noise Gate (Density Filter) ---

          # Search Space: [0.02, 0.05, 0.10]
          # --- 2. Spatial Granularity (Object Size) ---
          # Search Space: [32, 48, 64] (Pixels in Original Frame)
          # --- 1. Speed vs. Resolution Trade-off ---
          # Search Space: [1.0, 0.5, 0.25]
          # Logic:
          # - 2: High Sensitivity. Detects subtle color shifts in gray smoke. Risk: Sensor noise triggers it.
          # - 3: Standard. Good balance for general surveillance motion.
          # - 5: Low Sensitivity. Good for high-contrast flames, but will likely FAIL on faint smoke.
          diff_frame_th: [2, 3, 5]
          # --- Fixed Parameters (Accumulator Stability Structure) ---
          # These create the "3-frame hysteresis" stability logic.
          # Changing these alters the algorithm's fundamental behavior, not just sensitivity.
          impact_plus_one: 5
          mask_th: 10
          max_val: 25
          decay: 1
      # ! params for skip proc itself
      # Logic:
      # - 1.0 (Full Res): The baseline ground truth for accuracy.
      # - 0.5 (Half Res): The target for optimization. 4x speedup, usually retains enough detail.
      # - 0.25 (Quarter Res): Aggressive 16x speedup. Risk: Thin smoke plumes might disappear.
      scale_factor: [1.0]
      # Logic:
      # - 32px: High sensitivity. Necessary for detecting early ignition or small distant fires.
      # - 48px: Mid-range balance.
      # - 64px: Coarse. Efficient, but might miss small fires until they grow larger.
      block_size_orig: [32, 64]
      # Logic:
      # - 0.02 (2%): Very Sensitive. Catches wispy/transparent smoke edges. Risk: False Positives from leaves/noise.
      # - 0.05 (5%): Balanced. Standard "solid" motion.
      # - 0.10 (10%): Strict. Requires dense/large motion. Risk: Will likely miss early semi-transparent smoke.
      block_ratio_th: [0.05, 0.1, 0.15]
      # --- Fixed Parameters (Classifier Dependent) ---
      min_roi_ratio: 0.75

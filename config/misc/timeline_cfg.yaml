# Timeline Visualization & Reporting Configuration

# -----------------------------------------------------------------------------
# 1. Ground Truth (GT)
# -----------------------------------------------------------------------------
gt:
  meta:
    legend_title: "1. GT (Ground Truth)"

  timeline:
    labels:
      FireSmoke:
        color: "#f76060"
        additional_note: ~
      "None":
        color: "#dee2e6"
        additional_note: ~

  table:
    include: true

# -----------------------------------------------------------------------------
# 2. NO SKIP (Baseline)
# -----------------------------------------------------------------------------
no_skip:
  meta:
    legend_title: "2. NO SKIP (Baseline)"

  timeline:
    combine_rules:
      Correct: ["Correct Pos.", "Correct Neg."]

    labels:
      Correct:
        color: "#2b8a3e"
        additional_note: "Accurate predictions (TP/TN). Normalized by total frames."
      False Alarm:
        color: "#ebd91a"
        additional_note: "False Positive (FP). Normalized by actual negative frames."
      Miss:
        color: "#d00000"
        additional_note: "False Negative (FN). Normalized by actual positive frames."

  table:
    include: true
    highlight_rules:
      Miss:
        condition: "> 1"
        color: "#d00000"
      False Alarm:
        condition: "> 0.1"
        color: "#ebd91a"
    sort_by:
      Miss:
        direction: "desc"
        order: 1
      False Alarm:
        direction: "desc"
        order: 2

# -----------------------------------------------------------------------------
# 3. SKIP (Proposed Method)
# -----------------------------------------------------------------------------
skip:
  meta:
    legend_title: "3. SKIP (Proposed Method)"

  # | Metric        | Raw Count    | Denominator | %     | Standard Name      |
  # |---------------|------------- |-------------|-------|--------------------|
  # | Correct Infer | # Pos passed | Pos frames  | 99.4% | True Positive Rate |
  # | Correct Skip  | # Neg skipped| Neg frames  | 2.7%  | True Negative Rate |
  # | False Skip    | # Pos skipped| Pos frames  | 0.6%  | False Negative Rate|
  # | Wasted Infer  | # Neg passed | Neg frames  | 97.3% | False Positive Rate|

  timeline:
    labels:
      Correct Infer.:
        color: "#0060BD"
        additional_note: "Valid inference on target (TP). Normalized by actual positive frames."
      Correct Skip:
        color: "#68B8F7"
        additional_note: "Valid computational bypass (TN). Normalized by actual negative frames."
      False Skip:
        color: "#cf2b2b"
        additional_note: "Missed target due to unsafe skip (FN). Normalized by actual positive frames."
      Wasted Infer.:
        color: "#EB8B07"
        additional_note: "Unnecessary inference on background (FP). Normalized by actual negative frames."

  table:
    include: true
    highlight_rules:
      False Skip:
        condition: "> 1"
        color: "#cf2b2b"
      Wasted Infer.:
        condition: "> 10"
        color: "#EB8B07"
    sort_by:
      False Skip:
        direction: "desc"
        order: 1
      Wasted Infer.:
        direction: "desc"
        order: 4

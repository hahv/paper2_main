# ! prof. rule
extra_cfgs:
  result_proc:
    video: [video_block_skip_rs_proc, fgmask_block_skip_rs_proc]

  skip_proc:
    name: prof_skip_proc # no_skip_proc, rand_skip_proc
    params:
      scale_factor: 1.0 # 1.0 means no scaling
      block_size: 64
      block_roi_th: 200
      motion:
        name: acc_motion_det.AccMotionDet
        params:
          diff_frame_th: 3
          impact_plus_one: 5
          mask_th: 10
          max_val: 25
          decay: 1


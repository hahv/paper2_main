extra_cfgs:
  result_proc:
    video: [video_block_skip_rs_proc, fgmask_block_skip_rs_proc]
  skip_proc:
    name: rule_based_block_skip_proc.RuleBasedBlockSkipProc # no_skip_proc, rand_skip_proc
    params:
      motion: # ! params for motion detector inside skip proc
        name: framediff_det.FrameDiffDet
        params:
          diff_thresh: 30
      # ! params for skip proc itself
      scale_factor: 0.5
      block_size_orig: 64
      block_active_thresh: 0.1
      rule_params:
        active_ratio_threshold: 0.2
        wavelet_channel: r
        wavelet_energy_thres: 50.0

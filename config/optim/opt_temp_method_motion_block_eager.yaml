extra_cfgs:
  skip_proc:
    name: motion_only_block_skip_proc_eager # no_skip_proc, rand_skip_proc
    params:
      scale_factor: 0.5
      block_size_orig: 32
      block_ratio_th: 0.05
      motion:
        name: acc_motion_det.AccMotionDet
        params:
          diff_frame_th: 5
          impact_plus_one: 5
          mask_th: 5
          max_val: 15
          decay: 1

      n_chk: [10, 20, 30, 50] # forced check interval (skip state -> eager state transition)
      w_clr: [3, 5, 7] # eager exit window (frames) - number of consecutive clear frames to exit eager state and reset skip proc
      fire_confirm_k: [1, 2, 3] # number of consecutive motion frames to confirm fire state and exit eager state


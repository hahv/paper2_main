# Timeline Visualization & Reporting Configuration

# -----------------------------------------------------------------------------
# 1. Ground Truth (GT)
# -----------------------------------------------------------------------------
gt:
  meta:
    legend_title: "1. GT (Ground Truth)"

  timeline:
    labels:
      FireSmoke:
        color: "#fc6065"
        additional_note: ~
      "None":
        color: "#95a5a6"
        additional_note: ~

  table:
    include: true

# -----------------------------------------------------------------------------
# 2. NO SKIP (Baseline)
# -----------------------------------------------------------------------------
no_skip:
  meta:
    legend_title: "2. NO SKIP (Baseline)"

  timeline:
    combine_rules:
      Correct: ["Correct Pos.", "Correct Neg."]

    labels:
      Correct:
        color: "#2ecc71"
        additional_note: "Accurate predictions (TP/TN). Normalized by total frames."
      False Alarm:
        color: "#f39c12"
        additional_note: "False Positive (FP). Normalized by actual negative frames."
      Miss:
        color: "#c0392b"
        additional_note: "False Negative (FN). Normalized by actual positive frames."

  table:
    include: true
    highlight_rules:
      Miss:
        condition: "> 1"
        color: "#c0392b"
      False Alarm:
        condition: "> 0.1"
        color: "#f39c12"
    sort_by:
      Miss:
        direction: "desc"
        order: 1
      False Alarm:
        direction: "desc"
        order: 2

# -----------------------------------------------------------------------------
# 3. SKIP (Proposed Method)
# -----------------------------------------------------------------------------
skip:
  meta:
    legend_title: "3. SKIP (Proposed Method)"

  timeline:
    labels:
      Correct Infer.:
        color: "#2c3e50"
        additional_note: "Valid inference on target (TP). Normalized by total frames."
      Correct Skip:
        color: "#3498db"
        additional_note: "Valid computational bypass (TN). Normalized by total frames."
      False Skip:
        color: "#d81b60"
        additional_note: "Missed target due to unsafe skip (FN). Normalized by actual positive frames."
      Wasted Infer.:
        color: "#e67e22"
        additional_note: "Unnecessary inference on background (FP). Normalized by actual negative frames."

  table:
    include: true
    highlight_rules:
      False Skip:
        condition: "> 1"
        color: "#d81b60"
      Wasted Infer.:
        condition: "> 10"
        color: "#e67e22"
    sort_by:
      False Skip:
        direction: "desc"
        order: 1
      Wasted Infer.:
        direction: "desc"
        order: 4

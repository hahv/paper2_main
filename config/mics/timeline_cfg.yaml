# -----------------------------------------------------------------------------
# 1. Ground Truth (GT)
# -----------------------------------------------------------------------------
gt:
  meta:
    legend_title: "1. GT (Ground Truth)"

  timeline:
    labels_colors:
      FireSmoke: "#fc6065" # Kept: Soft Coral/Red. Good reference color.
      "None": "#95a5a6" # Kept: Neutral Gray. Recedes perfectly into the background.

  table:
    include: true

# -----------------------------------------------------------------------------
# 2. NO SKIP (Baseline)
# -----------------------------------------------------------------------------
no_skip:
  meta:
    legend_title: "2. NO SKIP (Baseline)"

  timeline:
    combine_rules:
      Correct: ["Correct Pos.", "Correct Neg."]

    labels_colors:
      Correct: "#2ecc71" # Kept: Green (Universal Success)
      False Alarm: "#f39c12" # TWEAKED: Deep Amber/Yellow. Slightly darker than previous gold for better readability against white text.
      Miss: "#c0392b" # CHANGED: Deep Crimson Red. A Miss is a critical failure. Crimson instantly alerts the user without matching GT's Coral.

  table:
    include: true
    highlight_rules:
      Miss:
        condition: "> 1"
        color: "#c0392b" # Updated to match timeline
      False Alarm:
        condition: "> 0.1"
        color: "#f39c12" # Updated to match timeline
    sort_by:
      Miss:
        direction: "desc"
        order: 1
      False Alarm:
        direction: "desc"
        order: 2

# -----------------------------------------------------------------------------
# 3. SKIP (Proposed Method)
# -----------------------------------------------------------------------------
skip:
  meta:
    legend_title: "3. SKIP (Proposed Method)"

  timeline:
    labels_colors:
      Correct Infer.: "#2c3e50" # Kept: Navy. Feels "heavy" (computation was done), but successful.
      Correct Skip: "#3498db" # Kept: Bright Blue. Feels "light" and cool (computation was saved).
      False Skip: "#d81b60" # TWEAKED: Ruby/Deep Magenta. Replaces the neon pink. It screams "Error!" but is highly distinct from Baseline's Crimson and GT's Coral.
      Wasted Infer.: "#e67e22" # Kept: Carrot Orange. Distinct from Baseline's Amber/Yellow False Alarm.

  table:
    include: true
    highlight_rules:
      False Skip:
        condition: "> 1"
        color: "#d81b60" # Updated to match timeline
      Wasted Infer.:
        condition: "> 10"
        color: "#e67e22"
    sort_by:
      False Skip:
        direction: "desc"
        order: 1
      Wasted Infer.:
        direction: "desc"
        order: 4

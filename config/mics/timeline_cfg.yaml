# Timeline Visualization & Reporting Configuration

# -----------------------------------------------------------------------------
# 1. Ground Truth (GT)
# -----------------------------------------------------------------------------
gt:
  meta:
    legend_title: "1. GT (Ground Truth)"

  # Visualization: Timeline colors
  timeline:
    labels_colors:
      FireSmoke: "#fc6065"
      "None": "#95a5a6" # Gray for neutral background (to avoid confusion with "Correct" Green)

  # Reporting: Statistics Table settings
  table:
    include: true

# -----------------------------------------------------------------------------
# 2. NO SKIP (Baseline)
# -----------------------------------------------------------------------------
no_skip:
  meta:
    legend_title: "2. NO SKIP (Baseline)"

  timeline:
    # ! Combine two or more labels into one for cleaner visualization (e.g., "Correct Pos." and "Correct Neg." into "Correct") - Optional
    combine_rules:
      Correct: ["Correct Pos.", "Correct Neg."]

    labels_colors:
      Correct: "#2ecc71" # Green
      False Alarm: "#f1c40f" # Gold
      Miss: "#8e44ad" # Purple (matches 'skip' method Miss color for consistency)

  table:
    include: true
    highlight_rules:
      # Highlight Miss (FN) when count > 1
      Miss:
        condition: "> 1"
        color: "#8e44ad"

      # Highlight False Alarm (FP) when count > 2
      False Alarm:
        condition: "> 0.1"
        color: "#f1c40f"

    # Sort priority: smaller number = higher priority
    sort_by:
      Miss:
        direction: "desc"
        order: 1
      False Alarm:
        direction: "desc"
        order: 2

# -----------------------------------------------------------------------------
# 3. SKIP (Proposed Method)
# -----------------------------------------------------------------------------
skip:
  meta:
    legend_title: "3. SKIP (Proposed Method)"

  timeline:
    labels_colors:
      False Skip: "#e84393" # Purple (Critical Failure)
      Redundant Infer.: "#e67e22" # Gold (Inefficiency)
      Correct Skip: "#3498db" # Teal (Efficiency Success)
      Correct Infer.: "#2c3e50" # Navy (Valid Hit)

  table:
    include: true
    highlight_rules:
      # Highlight Miss (FN) when count > 1
      False Skip:
        condition: "> 1"
        color: "#e84393"

      # Highlight Waste (FP) when count > 10
      Redundant Infer.:
        condition: "> 10"
        color: "#e67e22"

    # Sort priority: smaller number = higher priority
    sort_by:
      False Skip:
        direction: "desc"
        order: 1
      Redundant Infer.:
        direction: "desc"
        order: 4

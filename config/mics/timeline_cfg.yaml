# Timeline Visualization & Reporting Configuration

# -----------------------------------------------------------------------------
# 1. Ground Truth (GT)
# -----------------------------------------------------------------------------
gt:
  meta:
    legend_title: "1. GT (Ground Truth)"

  # Visualization: Timeline colors
  timeline:
    labels_colors:
      FireSmoke: "#fc6065"
      "None": "#95a5a6" # Gray for neutral background (to avoid confusion with "Correct" Green)

  # Reporting: Statistics Table settings
  table:
    include: true

# -----------------------------------------------------------------------------
# 2. NO SKIP (Baseline)
# -----------------------------------------------------------------------------
no_skip:
  meta:
    legend_title: "2. NO SKIP (Baseline)"

  timeline:
    labels_colors:
      Correct: "#2ecc71"           # Green
      False Alarm (FP): "#f1c40f"  # Gold
      Miss (FN): "#8e44ad"         # Purple (matches 'skip' method Miss color for consistency)

  table:
    include: true
    highlight_rules:
      # Highlight Miss (FN) when count > 1
      Miss (FN):
        condition: "> 1"
        color: "#8e44ad"

      # Highlight False Alarm (FP) when count > 2
      False Alarm (FP):
        condition: "> 0.1"
        color: "#f1c40f"

    # Sort priority: smaller number = higher priority
    sort_by:
      Miss (FN):
        direction: "desc"
        order: 1
      False Alarm (FP):
        direction: "desc"
        order: 2

# -----------------------------------------------------------------------------
# 3. SKIP (Proposed Method)
# -----------------------------------------------------------------------------
skip:
  meta:
    legend_title: "3. SKIP (Proposed Method)"

  timeline:
    labels_colors:
      Miss (FN): "#e84393"         # Purple (Critical Failure)
      Waste (FP): "#e67e22"        # Gold (Inefficiency)
      Correct Skip: "#3498db"      # Teal (Efficiency Success)
      Correct Proc.: "#2c3e50"     # Navy (Valid Hit)

  table:
    include: true
    highlight_rules:
      # Highlight Miss (FN) when count > 1
      Miss (FN):
        condition: "> 1"
        color: "#e84393"

      # Highlight Waste (FP) when count > 10
      Waste (FP):
        condition: "> 10"
        color: "#e67e22"

    # Sort priority: smaller number = higher priority
    sort_by:
      Miss (FN):
        direction: "desc"
        order: 3
      Waste (FP):
        direction: "desc"
        order: 4

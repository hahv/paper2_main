# Timeline Visualization & Reporting Configuration

# 1. Ground Truth (GT)
gt:
  meta:
    legend_title: "1. GT (Ground Truth)"

  # Visualization: Timeline colors
  timeline:
    labels_colors:
      FireSmoke: "#fc6065"
      None: "#95a5a6" # Changed to Gray for neutral background. Avoids confusion with "Correct" Green.

  # Reporting: Statistics Table settings
  table:
    include: true  # Single source of truth for visibility
    # ! order smaller number = higher priority
    # sort_by:
    #   FireSmoke:
    #     direction: "desc"
    #     order: 999
    #   None:
    #     direction: "desc"
    #     order: 12

# 2. NO SKIP (Baseline)
no_skip:
  meta:
    legend_title: "2. NO SKIP (Baseline)"

  timeline:
    labels_colors:
      Correct: "#2ecc71"           # Green
      False Alarm (FP): "#f1c40f"  # Gold
      Miss (FN): "#8e44ad"         # Purple. Matches 'skip' method Miss color for consistency.

  table:
    include: true
    highlight_rules:
      # Highlight Miss (FN)
      Miss (FN):
        condition: "> 1"
        color: "#8e44ad"
      # Highlight False Alarm (FP) if > 15%
      False Alarm (FP):
        condition: "> 2"
        color: "#f1c40f"
    # Implicitly no highlighting if 'highlight_rules' is missing
    # ! order smaller number = higher priority
    sort_by:
      Miss (FN):
        direction: "desc"
        order: 1
      False Alarm (FP):
        direction: "desc"
        order: 2

# 3. SKIP (Proposed Method)
skip:
  meta:
    legend_title: "3. SKIP (Proposed Method)"

  timeline:
    labels_colors:
      Miss (FN): "#8e44ad"         # Purple (Critical Failure)
      Waste (FP): "#f1c40f"        # Gold (Inefficiency)
      Correct Skip: "#00b894"      # Teal (Efficiency Success)
      Correct Proc.: "#2c3e50"     # Navy (Valid Hit)

  table:
    include: true
    highlight_rules:
      # Highlight Miss (FN) if > 5%
      Miss (FN):
        condition: "> 1"
        color: "#8e44ad"
      # Highlight Waste (FP) if > 10%
      Waste (FP):
        condition: "> 10"
        color: "#f1c40f"
    # ! order smaller number = higher priority
    sort_by:
      Miss (FN):
        direction: "desc"
        order: 3
      Waste (FP):
        direction: "desc"
        order: 4